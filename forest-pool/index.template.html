<title>Hidden River</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400&family=Inter:wght@400;500&display=swap">
<style>
  /* Full-bleed 3D canvas with a quiet glass overlay. Single committed dark look over the scene. */
  :root {
    --ink: #eef3e6;
    --ink-dim: rgba(238, 243, 230, 0.72);
    --glass: rgba(16, 26, 20, 0.42);
    --glass-strong: rgba(16, 26, 20, 0.66);
    --line: rgba(220, 240, 210, 0.18);
    --accent: #7fe0d4;
    --bg: #0d1510;
    --display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
    --ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--ui); overflow: hidden; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  .hud { position: fixed; z-index: 2; pointer-events: none; transition: opacity .4s ease; }
  .hud > * { pointer-events: auto; }
  body.clean .hud:not(.keep) { opacity: 0; pointer-events: none; }
  body.clean .hud:not(.keep) > * { pointer-events: none; }
  body.still .hud { display: none; }

  .title {
    top: calc(env(safe-area-inset-top, 0px) + 18px);
    left: max(18px, env(safe-area-inset-left, 0px));
    max-width: min(360px, calc(100% - 140px));
  }
  .title h1 { margin: 0; font: italic 400 26px/1.05 var(--display); letter-spacing: 0.01em; text-shadow: 0 1px 12px rgba(0,0,0,.45); }
  .title p { margin: 6px 0 0; font-size: 12px; line-height: 1.45; color: var(--ink-dim); text-shadow: 0 1px 8px rgba(0,0,0,.5); }

  .tools {
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 50%;
  }
  .views {
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: center;
  }
  .views .rail {
    display: flex; gap: 4px; flex-wrap: wrap; justify-content: center;
    padding: 5px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  }
  button {
    font: 500 13px/1 var(--ui); color: var(--ink); cursor: pointer;
    padding: 9px 13px; border-radius: 10px; border: 1px solid transparent; background: transparent;
    transition: background .2s, border-color .2s, color .2s;
  }
  button:hover { background: rgba(255,255,255,.08); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .views button[aria-pressed="true"] { background: rgba(127, 224, 212, 0.18); border-color: rgba(127, 224, 212, 0.45); }
  .tools button {
    background: var(--glass); border-color: var(--line); font-size: 12px; padding: 8px 11px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .tools button[aria-pressed="false"] { color: var(--ink-dim); }
  .tools button[aria-pressed="true"]::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 7px; vertical-align: 1px; }
  .credit {
    right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 74px);
    font-size: 10.5px; color: var(--ink-dim); text-shadow: 0 1px 6px rgba(0,0,0,.6);
  }
  .credit a { color: inherit; }

  #loader {
    position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: var(--bg);
    transition: opacity .9s ease, visibility .9s;
  }
  #loader.done { opacity: 0; visibility: hidden; }
  #loader .box { width: min(280px, 70vw); text-align: center; }
  #loader h2 { margin: 0 0 14px; font: italic 400 28px/1 var(--display); }
  #loader .track { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
  #loader-bar { height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); transition: transform .3s; }
  #loader-pct { margin-top: 10px; font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }

  @media (max-width: 560px) {
    .title h1 { font-size: 21px; }
    .title p { display: none; }
    .views button { padding: 8px 10px; font-size: 12px; }
    .credit { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { #loader, .hud { transition: none; } }

  /* Intro splash: shown for at least 15 s on every load, and until the scene is ready. */
  #intro {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: radial-gradient(120% 90% at 50% 55%, #14231a 0%, #070c09 70%);
    transition: opacity 1.2s ease, visibility 1.2s;
  }
  #intro.gone { opacity: 0; visibility: hidden; }
  #intro .wrap { width: 100%; padding: 0 16px; text-align: center; }
  #intro .name {
    margin: 0; font: 600 clamp(28px, 6.6vw, 92px)/1 var(--display); letter-spacing: 0.06em; margin-right: -0.1em;
    text-transform: uppercase; white-space: nowrap; color: var(--ink);
    animation: intro-track 15s cubic-bezier(.2,.6,.2,1) both;
  }
  #intro .word { display: inline-block; white-space: nowrap; }
  #intro .gap { display: inline-block; width: 0.42em; }
  #intro .ch {
    display: inline-block; opacity: 0; transform: translateY(0.45em) rotateX(70deg); filter: blur(10px);
    background: linear-gradient(100deg, #cfe3c8 0%, #ffffff 45%, var(--accent) 52%, #cfe3c8 60%, #cfe3c8 100%);
    background-size: 300% 100%; background-position: 100% 0;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: intro-in 1.1s cubic-bezier(.2,.8,.2,1) forwards, intro-shine 3.2s ease-in-out 2.4s infinite;
    animation-delay: calc(var(--i) * 90ms + 300ms), calc(var(--i) * 70ms + 2.4s);
  }
  #intro .tag {
    margin: 26px 0 34px; font: 400 clamp(11px, 1.4vw, 13px)/1 var(--ui); letter-spacing: 0.42em;
    text-transform: uppercase; color: var(--ink-dim); opacity: 0; animation: intro-fade 1.4s ease 1.8s forwards;
  }
  #intro .meter { width: min(360px, 70vw); margin: 0 auto; opacity: 0; animation: intro-fade 1s ease 1.4s forwards; }
  #intro .track { height: 1px; background: var(--line); overflow: hidden; }
  #intro .fill { height: 100%; background: linear-gradient(90deg, transparent, var(--accent)); transform-origin: left; transform: scaleX(0); }
  #intro .row { display: flex; justify-content: space-between; margin-top: 12px; font: 400 11px/1 var(--ui); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  @keyframes intro-in { to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes intro-shine { 0% { background-position: 100% 0; } 60%, 100% { background-position: 0% 0; } }
  @keyframes intro-fade { to { opacity: 1; } }
  @keyframes intro-track { from { letter-spacing: 0.02em; } to { letter-spacing: 0.1em; } }
  @media (prefers-reduced-motion: reduce) {
    #intro .name { animation: none; }
    #intro .ch { animation: intro-fade .6s ease forwards; transform: none; filter: none; }
  }
</style>

<div id="intro" role="status" aria-label="MUNI MADAGODU — loading">
  <div class="wrap">
    <h2 class="name" aria-hidden="true"></h2>
    <p class="tag">Hidden River &middot; real-time forest</p>
    <div class="meter">
      <div class="track"><div class="fill"></div></div>
      <div class="row"><span class="msg">Loading</span><span class="num">0%</span></div>
    </div>
  </div>
</div>
<script>
(() => {
  const intro = document.getElementById('intro');
  if (/[?&]still=1/.test(location.search)) { intro.remove(); return; }
  const NAME = 'MUNI MADAGODU', MIN_MS = 15000;
  const h = intro.querySelector('.name');
  let i = 0;
  NAME.split(' ').forEach((w, wi) => {
    if (wi) { const g = document.createElement('span'); g.className = 'gap'; h.appendChild(g); }
    const word = document.createElement('span'); word.className = 'word';
    for (const c of w) { const s = document.createElement('span'); s.className = 'ch'; s.style.setProperty('--i', i++); s.textContent = c; word.appendChild(s); }
    h.appendChild(word);
  });
  const fill = intro.querySelector('.fill'), num = intro.querySelector('.num'), msg = intro.querySelector('.msg');
  const steps = ['Loading', 'Growing trees', 'Filling the river', 'Scattering leaves', 'Catching the light', 'Almost there'];
  const t0 = performance.now();
  let sceneReady = false;
  const watch = () => {
    const l = document.getElementById('loader');
    if (!l) return;
    const check = () => { if (l.classList.contains('done')) sceneReady = true; };
    check(); new MutationObserver(check).observe(l, { attributes: true, attributeFilter: ['class'] });
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watch); else watch();
  const tick = (now) => {
    const k = Math.min(1, (now - t0) / MIN_MS);
    // ease to 96% over 15 s, then hold until the scene is actually ready
    const p = sceneReady && k >= 1 ? 1 : 0.96 * (1 - Math.pow(1 - k, 2.2));
    fill.style.transform = `scaleX(${p})`;
    num.textContent = `${Math.round(p * 100)}%`;
    msg.textContent = p >= 1 ? 'Enter' : steps[Math.min(steps.length - 1, Math.floor(k * steps.length))];
    if (p >= 1) { setTimeout(() => intro.classList.add('gone'), 450); setTimeout(() => intro.remove(), 1800); return; }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
</script>

<canvas id="scene" tabindex="0" aria-label="3D forest pool scene. Drag to look around."></canvas>

<div id="loader" role="status" aria-live="polite">
  <div class="box">
    <h2>Hidden River</h2>
    <div class="track"><div id="loader-bar"></div></div>
    <div id="loader-pct">0%</div>
  </div>
</div>

<div class="hud title">
  <h1>Hidden River</h1>
  <p>Drag to look around · scroll or pinch to zoom · right-drag to pan · W A S D to walk</p>
</div>

<div class="hud tools keep">
  <button type="button" data-toggle="wind" aria-pressed="true">Wind</button>
  <button type="button" data-toggle="rays" aria-pressed="true">Light rays</button>
  <button type="button" data-toggle="drift" aria-pressed="false">Drift</button>
  <button type="button" id="hide-ui" aria-label="Hide or show the controls">Hide UI</button>
</div>

<nav class="hud views" aria-label="Camera views">
  <div class="rail">
    <button type="button" data-preset="trail" aria-pressed="true">Trail</button>
    <button type="button" data-preset="edge" aria-pressed="false">Water's edge</button>
    <button type="button" data-preset="farbank" aria-pressed="false">Far bank</button>
    <button type="button" data-preset="canopy" aria-pressed="false">Canopy</button>
    <button type="button" data-preset="above" aria-pressed="false">Above</button>
  </div>
</nav>
